version: 2

# Local multi-platform builds: `goreleaser build --snapshot --clean`
# Publishing (when ready): `goreleaser release` — requires GITHUB_TOKEN.
project_name: loop-guard

builds:
  - id: loop-guard
    main: .
    binary: loop-guard
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # windows/arm64 is rare; trim matrix noise
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/bjmiller/loop-guard/internal/version.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Release publishing is not enabled yet.
release:
  disable: true

brews:
  # goreleaser generates the tap formula on release; the checked-in
  # Formula/loop-guard.rb mirrors this template with checksums unset.
  - repository:
      owner: bjmiller
      name: homebrew-loop-guard
    directory: Formula/
    homepage: "https://github.com/bjmiller/loop-guard"
    description: "Infinite-loop prevention for coding agents"
    license: "MIT"
